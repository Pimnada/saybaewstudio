; PHP limits for a photography site. Read by PHP-FPM (which is what Cloudways
; runs), so this travels with the code and does not depend on remembering to
; set it in a control panel.
;
; Both limits have to move together: upload_max_filesize caps the file and
; post_max_size caps the whole request body. Whichever is smaller is the real
; ceiling — a 100M file limit behind a 10M body limit still rejects at 10M.
;
; The built-in dev server (php -S) ignores this file; .claude/launch.json passes
; the same values with -d instead.
;
; nginx on Cloudways still cuts a request at roughly 128 MiB no matter what is
; set here, which is why the uploader sends one photo per request.

upload_max_filesize = 64M
post_max_size = 72M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
